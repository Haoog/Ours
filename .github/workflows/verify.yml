name: Verify
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix cloudfunctions/ours ci
      - run: npm --prefix cloudfunctions/admin-api ci
      - run: npm --prefix admin-web ci
      - run: npm run typecheck
      - run: npm run verify:core
      - run: npm run verify:frontend
      - run: npm run verify:features
      - run: npm run admin:build
      # 网页版与同步服务不依赖 npm 安装，直接构建并跑无需浏览器的回归。
      - name: Verify web app
        run: |
          npm --prefix web run build
          npm --prefix web run verify
          node --test web/tests/wx-import.test.mjs web/tests/wx-prepare.test.mjs
      - name: Verify sync service
        run: npm --prefix ours-sync test
